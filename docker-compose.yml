services:
  telemetry-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arduino_telemetry_gateway
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      SIMULATOR_ENABLED: "true"
      TELEMETRY_ENDPOINT: "http://127.0.0.1:8080/api/v1/telemetry"
      WEB_SERVER_ENABLED: "true"
      WEB_PORT: 8080
      LOG_LEVEL: "INFO"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
